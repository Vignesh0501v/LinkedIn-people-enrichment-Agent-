# Minimal SPA config (Plan unit #22). No /api reverse proxy: docker-compose
# publishes the backend on the host's port 8000 and the frontend's built-in
# VITE_API_BASE_URL points there, so the browser reaches the API directly.
# Adding a proxy hop would be a second place to keep the URL scheme correct
# for no benefit at this scale.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: any unknown path is the SPA's, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # a deploy would keep serving the previous bundle's script tags.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
